<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belief System</title>
<style>
:root{--bg:#f5efe6;--fg:#3b2a20;--card:#fff;--acc:#5a3d2b}
@media(prefers-color-scheme:dark){:root{--bg:#1d1612;--fg:#f1e6d8;--card:#2a201a;--acc:#c9a27e}}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;margin:0;padding:24px 16px;max-width:560px;margin-inline:auto}
h1{font-size:28px;margin:0 0 4px}p.s{margin:0 0 20px;opacity:.7}
.c{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
.c b{display:block;font-size:18px;margin-bottom:12px}
.r{display:flex;gap:8px;flex-wrap:wrap}
button{border:2px solid var(--acc);background:none;color:var(--fg);border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer}
button.on{background:var(--acc);color:var(--bg)}
input{width:100%;box-sizing:border-box;margin-top:10px;padding:10px;font-size:16px;border-radius:10px;border:1px solid var(--acc);display:none;background:var(--bg);color:var(--fg)}
#go{width:100%;background:var(--acc);color:var(--bg);margin-top:8px}
</style></head><body>
<h1>Belief System</h1><p class="s">Vrai, faux, ou à changer ?</p>
<div id="l"></div>
<button id="go">Copier mes réponses</button>
<p class="s" id="m" style="margin-top:12px"></p>
<script>
const B=["Elle veut passer du contenu+ebooks à une app comme prochain gros levier","Elle préfère la vitesse à la perfection"];
const a={};const L=document.getElementById("l");
B.forEach((t,i)=>{const d=document.createElement("div");d.className="c";
d.innerHTML=`<b>${t}</b><div class="r">${["Vrai","Faux","À changer"].map(v=>`<button>${v}</button>`).join("")}</div><input placeholder="Plutôt : …">`;
const bs=d.querySelectorAll("button"),inp=d.querySelector("input");
bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>x.classList.remove("on"));b.classList.add("on");a[i]=b.textContent;inp.style.display=b.textContent=="À changer"?"block":"none"});
inp.oninput=()=>a["t"+i]=inp.value;L.appendChild(d)});
document.getElementById("go").onclick=()=>{
const s=B.map((t,i)=>`${t} → ${a[i]||"?"}${a["t"+i]?" : "+a["t"+i]:""}`).join("\n");
(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>m.textContent="Copié. Colle dans le chat, puis écris go.").catch(()=>m.textContent=s)};
</script></body></html>
